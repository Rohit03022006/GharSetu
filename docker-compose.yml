services:
  # =================================================================
  # 1. Infrastructure Services (PostgreSQL, Redis, MinIO)
  # =================================================================

  # PostgreSQL Multi-Database Container
  # Host port mapped to 5433 (or POSTGRES_PORT) to prevent conflict with local host Postgres (port 5432)
  postgres:
    image: postgres:16
    container_name: gharsetu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8989
      POSTGRES_DB: gharsetu
      POSTGRES_MULTIPLE_DATABASES: "identity_db,finance_db,listing_db,preference_db,discovery_db,engagement_db,analytics_db"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gharsetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache & Pub/Sub
  # Host port mapped to 6380 (or REDIS_PORT) to prevent conflict with local host Redis (port 6379)
  redis:
    image: redis:7
    container_name: gharsetu-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: gharsetu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================================================
  # 2. Microservices Layer
  # =================================================================

  # Identity Service (Port 4001)
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: gharsetu-identity-service
    ports:
      - "4001:4001"
    env_file:
      - ./services/identity-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/identity_db?schema=public"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Finance Service (Port 4002)
  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    container_name: gharsetu-finance-service
    ports:
      - "4002:4002"
    env_file:
      - ./services/finance-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/finance_db?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  # Listing Service (Port 4003)
  listing-service:
    build:
      context: ./services/listing-service
      dockerfile: Dockerfile
    container_name: gharsetu-listing-service
    ports:
      - "4003:4003"
    env_file:
      - ./services/listing-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/listing_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Preference Service (Port 4004)
  preference-service:
    build:
      context: ./services/preference-service
      dockerfile: Dockerfile
    container_name: gharsetu-preference-service
    ports:
      - "4004:4004"
    env_file:
      - ./services/preference-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/preference_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      LISTING_SERVICE_URL: "http://listing-service:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Discovery History Service (Port 4005)
  discovery-history-service:
    build:
      context: ./services/discovery-history-service
      dockerfile: Dockerfile
    container_name: gharsetu-discovery-service
    ports:
      - "4005:4005"
    env_file:
      - ./services/discovery-history-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/discovery_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      LISTING_SERVICE_URL: "http://listing-service:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Engagement Service (Port 4006)
  engagement-service:
    build:
      context: ./services/engagement-service
      dockerfile: Dockerfile
    container_name: gharsetu-engagement-service
    ports:
      - "4006:4006"
    env_file:
      - ./services/engagement-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/engagement_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      LISTING_SERVICE_URL: "http://listing-service:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Analytics Service (Port 4007)
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: gharsetu-analytics-service
    ports:
      - "4007:4007"
    env_file:
      - ./services/analytics-service/.env
    environment:
      DATABASE_URL: "postgresql://postgres:8989@postgres:5432/analytics_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      LISTING_SERVICE_URL: "http://listing-service:4003"
      ENGAGEMENT_SERVICE_URL: "http://engagement-service:4006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =================================================================
  # 3. API Gateway Layer (Port 4000)
  # =================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: gharsetu-api-gateway
    ports:
      - "4000:4000"
    env_file:
      - ./services/api-gateway/.env
    environment:
      IDENTITY_SERVICE_URL: "http://identity-service:4001"
      FINANCE_SERVICE_URL: "http://finance-service:4002"
      LISTING_SERVICE_URL: "http://listing-service:4003"
      PREFERENCE_SERVICE_URL: "http://preference-service:4004"
      DISCOVERY_SERVICE_URL: "http://discovery-history-service:4005"
      ENGAGEMENT_SERVICE_URL: "http://engagement-service:4006"
      ANALYTICS_SERVICE_URL: "http://analytics-service:4007"
    depends_on:
      - identity-service
      - finance-service
      - listing-service
      - preference-service
      - discovery-history-service
      - engagement-service
      - analytics-service

  # =================================================================
  # 4. Frontend Client SPA (Vite + React + Nginx)
  # =================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gharsetu-client
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - api-gateway

# =================================================================
# Persistent Volumes
# =================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
